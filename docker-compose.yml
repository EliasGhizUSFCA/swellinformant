# Swell Travel Agent — full local stack.
#
#   cp .env.example .env      # optional; every value has a working demo default
#   docker compose up --build
#
# Web app http://localhost:3000 · API http://localhost:8000 (docs at /docs)
# Development inbox (Mailpit): every email the app sends is captured at http://localhost:8025

x-backend-env: &backend-env
  # Values from .env override these defaults; infrastructure URLs point at the compose services.
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Links in emails. Default to the published ports so a changed FRONTEND_PORT/BACKEND_PORT
  # never produces dead verification or alert links.
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
  API_BASE_URL: ${API_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}}
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
  ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-false}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-swell}:${POSTGRES_PASSWORD:-swell}@postgres:5432/${POSTGRES_DB:-swell}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  BEAT_RUN_ON_START: ${BEAT_RUN_ON_START:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  # Reverse proxies in front of the API that set or append X-Forwarded-For (rate limits use
  # the client IP they forward). The frontend's /api proxy passes the header on unchanged
  # and adds no entry, so it does not count: 1 = the TLS proxy (Caddy, nginx with
  # $proxy_add_x_forwarded_for) in front of the frontend. Without such a proxy the header
  # is whatever the client sent.
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
  # A header a platform in front of the API sets and clients cannot overwrite (Vercel:
  # x-vercel-forwarded-for); when set, it replaces X-Forwarded-For. Empty = not used.
  CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
  # Who runs the jobs. celery (this stack's default): the worker and beat below. daemon: the
  # optional "sync" service at the end, for the whole stack (see there).
  JOB_RUNNER: ${JOB_RUNNER:-celery}
  # Bearer token of GET /api/internal/cron/daily, the daily watchdog Vercel Cron calls (at
  # least 16 characters). Empty = the route answers 404; the classic stack does not need it.
  CRON_SECRET: ${CRON_SECRET:-}
  # true once the site is used commercially (a paywall, ads): the free Open-Meteo API is
  # non-commercial, so Open-Meteo then needs OPEN_METEO_API_KEY. OPEN_METEO_COMMERCIAL is the
  # same setting under its Swell 2.0 name (it wins when set).
  COMMERCIAL_USE: ${COMMERCIAL_USE:-false}
  OPEN_METEO_COMMERCIAL: ${OPEN_METEO_COMMERCIAL:-}
  # Database and Redis connections. Empty = the defaults of backend/app/core/config.py, right
  # for this stack; a pooler in transaction mode (PgBouncer, Neon's pooled URL) needs
  # DB_PREPARED_STATEMENTS=false.
  DB_PREPARED_STATEMENTS: ${DB_PREPARED_STATEMENTS:-}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-}
  REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-}
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-}
  # The synced data pipeline (docs/sync.md): a sync runs when a new model run is out, under
  # Celery as the sync.tick job (every SYNC_CHECK_MINUTES), under the daemon as its checks.
  # Empty = the defaults of backend/app/core/config.py.
  SYNC_CHECK_MINUTES: ${SYNC_CHECK_MINUTES:-}
  SYNC_COALESCE_MINUTES: ${SYNC_COALESCE_MINUTES:-}
  SYNC_TRIGGER_SOURCES: ${SYNC_TRIGGER_SOURCES:-}
  SYNC_DAEMON_KINDS: ${SYNC_DAEMON_KINDS:-}
  SYNC_RETRY_MINUTES: ${SYNC_RETRY_MINUTES:-}
  SYNC_MAX_ATTEMPTS: ${SYNC_MAX_ATTEMPTS:-}
  SYNC_LEASE_MINUTES: ${SYNC_LEASE_MINUTES:-}
  SYNC_PUBLISH_GATE: ${SYNC_PUBLISH_GATE:-}
  SYNC_PRUNE_EACH_PASS: ${SYNC_PRUNE_EACH_PASS:-}
  # After a publishing sync, compute the public spot list and conditions at once (about
  # 1.4 MB of database reads per publication) instead of at the first visitor's request.
  SYNC_PREWARM_PUBLIC_CACHE: ${SYNC_PREWARM_PUBLIC_CACHE:-}
  SYNC_DAEMON_POLL_SECONDS: ${SYNC_DAEMON_POLL_SECONDS:-}
  SYNC_DAEMON_INIT_DB: ${SYNC_DAEMON_INIT_DB:-}
  # Monthly CPU budget in hours (health warns at 80 %); empty = none.
  SYNC_CPU_BUDGET_HOURS: ${SYNC_CPU_BUDGET_HOURS:-}
  # Every periodic job runs at most this often (minutes); empty = the schedule as written.
  JOB_INTERVAL_FLOOR_MINUTES: ${JOB_INTERVAL_FLOOR_MINUTES:-}
  # Forecast sources (docs/API_SETUP_REQUIRED.md). This stack's default is demo (synthetic
  # data, no provider is called); live: WEATHER_PROVIDER=auto (Windy once it is eligible,
  # else Open-Meteo) or open_meteo. FORECAST_PROVIDERS is the advanced override (empty =
  # derived from WEATHER_PROVIDER). Empty values below fall back to the defaults in
  # backend/app/core/config.py.
  WEATHER_PROVIDER: ${WEATHER_PROVIDER:-demo}
  FORECAST_PROVIDERS: ${FORECAST_PROVIDERS:-}
  FORECAST_DAYS: ${FORECAST_DAYS:-10}
  FORECAST_REFRESH_ENABLED: ${FORECAST_REFRESH_ENABLED:-}
  FORECAST_STALE_THRESHOLD_MINUTES: ${FORECAST_STALE_THRESHOLD_MINUTES:-}
  FORECAST_STALE_THRESHOLD_MINUTES_BY_MODEL: ${FORECAST_STALE_THRESHOLD_MINUTES_BY_MODEL:-}
  FORECAST_MIN_VALID_FRACTION: ${FORECAST_MIN_VALID_FRACTION:-}
  FORECAST_VERSION_CDN_SECONDS: ${FORECAST_VERSION_CDN_SECONDS:-}
  FORECAST_REFRESH_MINUTES: ${FORECAST_REFRESH_MINUTES:-180}
  FORECAST_BATCH_SIZE: ${FORECAST_BATCH_SIZE:-}
  OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
  OPEN_METEO_GFS_WAVE_MODELS: ${OPEN_METEO_GFS_WAVE_MODELS:-}
  OPEN_METEO_GFS_ATMOS_MODEL: ${OPEN_METEO_GFS_ATMOS_MODEL:-}
  OPEN_METEO_ECMWF_WAVE_MODEL: ${OPEN_METEO_ECMWF_WAVE_MODEL:-}
  OPEN_METEO_ECMWF_ATMOS_MODEL: ${OPEN_METEO_ECMWF_ATMOS_MODEL:-}
  # Deprecated single-model aliases: set only if you mean to override the two above.
  OPEN_METEO_WAVE_MODEL: ${OPEN_METEO_WAVE_MODEL:-}
  OPEN_METEO_ATMOS_MODEL: ${OPEN_METEO_ATMOS_MODEL:-}
  OPEN_METEO_CELL_SELECTION: ${OPEN_METEO_CELL_SELECTION:-}
  OPEN_METEO_AVAILABILITY_WAIT_MINUTES: ${OPEN_METEO_AVAILABILITY_WAIT_MINUTES:-}
  OPEN_METEO_NATIVE_STEPS_ONLY: ${OPEN_METEO_NATIVE_STEPS_ONLY:-}
  OPEN_METEO_CALLS_PER_MINUTE: ${OPEN_METEO_CALLS_PER_MINUTE:-}
  OPEN_METEO_CALLS_PER_HOUR: ${OPEN_METEO_CALLS_PER_HOUR:-}
  OPEN_METEO_CALLS_PER_DAY: ${OPEN_METEO_CALLS_PER_DAY:-}
  OPEN_METEO_CALLS_PER_MONTH: ${OPEN_METEO_CALLS_PER_MONTH:-}
  PROVIDER_RESPONSE_CACHE_ENABLED: ${PROVIDER_RESPONSE_CACHE_ENABLED:-}
  PROVIDER_RESPONSE_CACHE_MAX_BYTES: ${PROVIDER_RESPONSE_CACHE_MAX_BYTES:-}
  PROVIDER_RESPONSE_CACHE_MAX_KEYS: ${PROVIDER_RESPONSE_CACHE_MAX_KEYS:-}
  WINDY_API_KEY: ${WINDY_API_KEY:-}
  # A key is not a licence: Windy data are used only with WINDY_STORAGE_AUTHORIZED=true (its
  # old name WINDY_TERMS_ACKNOWLEDGED is still read). Empty = false.
  WINDY_STORAGE_AUTHORIZED: ${WINDY_STORAGE_AUTHORIZED:-}
  WINDY_TERMS_ACKNOWLEDGED: ${WINDY_TERMS_ACKNOWLEDGED:-}
  WINDY_CHECK_MINUTES: ${WINDY_CHECK_MINUTES:-}
  WINDY_DAILY_REQUEST_LIMIT: ${WINDY_DAILY_REQUEST_LIMIT:-}
  DEMO_NATURAL_SWELLS: ${DEMO_NATURAL_SWELLS:-true}
  # Blend, ensemble and the optional direct GRIB fallbacks (noaa_gfs, ecmwf_ifs).
  FORECAST_BLEND_ENABLED: ${FORECAST_BLEND_ENABLED:-true}
  GEFS_ENABLED: ${GEFS_ENABLED:-false}
  GEFS_STAT_FIELDS: ${GEFS_STAT_FIELDS:-}
  GEFS_CYCLES: ${GEFS_CYCLES:-}
  NOAA_STEP_HOURS: ${NOAA_STEP_HOURS:-3}
  NOAA_MAX_LEAD_HOURS: ${NOAA_MAX_LEAD_HOURS:-240}
  ECMWF_MAX_LEAD_HOURS: ${ECMWF_MAX_LEAD_HOURS:-240}
  ECMWF_WAVE_PARAMS: ${ECMWF_WAVE_PARAMS:-}
  GRIB_DOWNLOAD_WORKERS: ${GRIB_DOWNLOAD_WORKERS:-6}
  # Buoy observations, verification and ML post-processing (off by default).
  OBSERVATIONS_ENABLED: ${OBSERVATIONS_ENABLED:-false}
  OBSERVATION_PROVIDERS: ${OBSERVATION_PROVIDERS:-aodn,metoffice,ndbc}
  VERIFICATION_ENABLED: ${VERIFICATION_ENABLED:-false}
  ML_CORRECTIONS_ENABLED: ${ML_CORRECTIONS_ENABLED:-false}
  PREDICTION_ARCHIVE_ENABLED: ${PREDICTION_ARCHIVE_ENABLED:-}
  ML_ARTIFACT_DIR: /var/lib/swell-ml
  # Map ocean layers: empty = automatic (docs/map-layers.md), true = standalone, false = off.
  MAP_FIELDS_ENABLED: ${MAP_FIELDS_ENABLED:-}
  MAP_FIELD_ATMOS_GRID: ${MAP_FIELD_ATMOS_GRID:-}
  MAP_FIELD_STEPS: ${MAP_FIELD_STEPS:-}
  MAP_FIELD_MAX_LEAD_HOURS: ${MAP_FIELD_MAX_LEAD_HOURS:-}
  MAP_FIELD_CYCLES: ${MAP_FIELD_CYCLES:-}
  MAP_FIELD_PARTITIONS: ${MAP_FIELD_PARTITIONS:-}
  MAP_FIELD_MAX_BYTES_PER_RUN: ${MAP_FIELD_MAX_BYTES_PER_RUN:-}
  MAP_FIELD_STALE_AFTER_HOURS: ${MAP_FIELD_STALE_AFTER_HOURS:-}
  # Tides (docs/tides.md): NOAA CO-OPS for US spots, a harmonic model elsewhere.
  TIDE_PROVIDERS: ${TIDE_PROVIDERS:-}
  NOAA_COOPS_APPLICATION: ${NOAA_COOPS_APPLICATION:-}
  TIDE_MODEL: ${TIDE_MODEL:-}
  TIDE_HORIZON_DAYS: ${TIDE_HORIZON_DAYS:-}
  TIDE_RETENTION_PAST_DAYS: ${TIDE_RETENTION_PAST_DAYS:-}
  NDBC_USE_5DAY: ${NDBC_USE_5DAY:-}
  WIND_GUST_SCORING: ${WIND_GUST_SCORING:-}
  SCORING_WEIGHTS_JSON: ${SCORING_WEIGHTS_JSON:-}
  # Retention (maintenance.cleanup, daily 03:30 UTC); sizes per day in docs/operations.md.
  RETENTION_FORECAST_DAYS: ${RETENTION_FORECAST_DAYS:-10}
  RETENTION_FLIGHT_DAYS: ${RETENTION_FLIGHT_DAYS:-30}
  RETENTION_JOB_LOG_DAYS: ${RETENTION_JOB_LOG_DAYS:-30}
  RETENTION_NOTIFICATION_DAYS: ${RETENTION_NOTIFICATION_DAYS:-365}
  RETENTION_ARCHIVE_DAYS: ${RETENTION_ARCHIVE_DAYS:-730}
  ARCHIVE_CONFIDENCE_DIGEST: ${ARCHIVE_CONFIDENCE_DIGEST:-}
  PRUNE_SUPERSEDED_MEMBER_PREDICTIONS: ${PRUNE_SUPERSEDED_MEMBER_PREDICTIONS:-}
  OBSERVATION_RETENTION_DAYS: ${OBSERVATION_RETENTION_DAYS:-}
  # Data health (GET /api/health/data, job ops.data_health) and the admin email alerts.
  DATA_HEALTH_CHECK_MINUTES: ${DATA_HEALTH_CHECK_MINUTES:-15}
  DATA_HEALTH_ALERTS_ENABLED: ${DATA_HEALTH_ALERTS_ENABLED:-true}
  # Addresses (comma-separated) the daily watchdog (GET /api/internal/cron/daily) emails when
  # the database itself cannot be reached; empty = none (the admins are read from the database).
  OPS_ALERT_EMAILS: ${OPS_ALERT_EMAILS:-}
  DATA_HEALTH_ALERT_REPEAT_HOURS: ${DATA_HEALTH_ALERT_REPEAT_HOURS:-12}
  DATA_HEALTH_HEARTBEAT_MINUTES: ${DATA_HEALTH_HEARTBEAT_MINUTES:-30}
  DATA_HEALTH_OBSERVATION_STALE_HOURS: ${DATA_HEALTH_OBSERVATION_STALE_HOURS:-}
  DATA_HEALTH_DATABASE_MAX_GB: ${DATA_HEALTH_DATABASE_MAX_GB:-}
  DATA_HEALTH_REDIS_MAX_FRACTION: ${DATA_HEALTH_REDIS_MAX_FRACTION:-}
  QUOTA_ALERT_FRACTION: ${QUOTA_ALERT_FRACTION:-}
  REFRESH_SCHEDULER_EXPECTED_MINUTES: ${REFRESH_SCHEDULER_EXPECTED_MINUTES:-}
  # Reported by the data-health check; keep equal to the redis service's --maxmemory.
  REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
  # Queues the worker consumes: "celery" (emails, alerts) and "bulk" (data downloads).
  WORKER_QUEUES: ${WORKER_QUEUES:-celery,bulk}
  DETECTION_LEAD_MIN_DAYS: ${DETECTION_LEAD_MIN_DAYS:-1}
  DETECTION_LEAD_MAX_DAYS: ${DETECTION_LEAD_MAX_DAYS:-10}
  ALERT_LEAD_DEFAULT_MIN_DAYS: ${ALERT_LEAD_DEFAULT_MIN_DAYS:-}
  ALERT_LEAD_DEFAULT_MAX_DAYS: ${ALERT_LEAD_DEFAULT_MAX_DAYS:-}
  SHORT_NOTICE_MIN_DAYS: ${SHORT_NOTICE_MIN_DAYS:-}
  SHORT_NOTICE_MAX_DAYS: ${SHORT_NOTICE_MAX_DAYS:-}
  FLIGHT_PROVIDER: ${FLIGHT_PROVIDER:-demo}
  DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:-}
  AMADEUS_CLIENT_ID: ${AMADEUS_CLIENT_ID:-}
  AMADEUS_CLIENT_SECRET: ${AMADEUS_CLIENT_SECRET:-}
  AMADEUS_BASE_URL: ${AMADEUS_BASE_URL:-https://api.amadeus.com}
  FLIGHT_DAILY_QUOTA: ${FLIGHT_DAILY_QUOTA:-300}
  FLIGHT_USER_DAILY_QUOTA: ${FLIGHT_USER_DAILY_QUOTA:-}
  FX_RATES_USD_JSON: ${FX_RATES_USD_JSON:-}
  # mailpit = capture every email in the local dev inbox (http://localhost:8025). Set
  # smtp / resend / sendgrid in .env for real delivery.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
  DEV_INBOX_URL: ${DEV_INBOX_URL:-http://localhost:${MAILPIT_UI_PORT:-8025}}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  SENDGRID_WEBHOOK_PUBLIC_KEY: ${SENDGRID_WEBHOOK_PUBLIC_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-Swell Travel Agent <alerts@localhost>}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
  OUTBOX_DIR: /tmp/swell-outbox

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  # Override BACKEND_IMAGE / FRONTEND_IMAGE to run a pinned, pre-built release tag.
  image: ${BACKEND_IMAGE:-swell-travel-agent/backend:local}
  environment: *backend-env
  volumes:
    # Console email/SMS providers write here; shared so the API's /api/dev/outbox can read it.
    - outbox:/tmp/swell-outbox
    # Trained ML correction artifacts (checksum-verified on load).
    - ml-artifacts:/var/lib/swell-ml
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swell}
      POSTGRES_DB: ${POSTGRES_DB:-swell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Broker, locks, quota counters and the small provider response cache. noeviction: a
  # broker must never lose messages, so a full Redis refuses writes instead; the data-health
  # check reports used memory against the cap (alert above DATA_HEALTH_REDIS_MAX_FRACTION).
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # API. On start it applies migrations and loads the 50-spot reference data (idempotent).
  backend:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      API_WORKERS: ${API_WORKERS:-2}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s

  # Celery worker: runs sync.tick, which syncs everything a new model run brings in one go
  # (spot forecasts and map layers, blend, predictions, publish, then swell detection,
  # matching, flights, alerts and delivery; docs/sync.md), plus the periodic jobs beat
  # schedules (tides, emails, data health, cleanup). The default WORKER_QUEUES=celery,bulk
  # consumes both queues.
  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  # Optional second worker for the "bulk" queue only (downloads), so the main worker's slots
  # stay free for emails and alerts:
  #   WORKER_QUEUES=celery docker compose --profile bulk-worker up -d
  # (WORKER_QUEUES=celery then applies to the main worker; this one always takes "bulk").
  worker-bulk:
    <<: *backend
    profiles: ["bulk-worker"]
    command: ["worker"]
    environment:
      <<: *backend-env
      WORKER_QUEUES: bulk
      WORKER_CONCURRENCY: ${BULK_WORKER_CONCURRENCY:-2}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  # Celery beat: the job scheduler (starts once the schema exists). Run exactly one, and never
  # together with the "sync" service below.
  beat:
    <<: *backend
    command: ["beat"]
    depends_on:
      backend:
        condition: service_healthy
    # Beat rewrites its schedule file whenever it sends tasks (notifications.deliver every
    # 2 min, synced at least every 3 min); a file untouched for 10 min means beat is stuck.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp -maxdepth 1 -name 'celerybeat-schedule*' -mmin -10 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Optional, instead of worker and beat: the sync daemon (`python -m app.cli sync daemon`),
  # the job runner of the Vercel deployment (docs/sync.md). It checks the providers every
  # SYNC_CHECK_MINUTES, syncs each new model run, runs the periodic jobs itself and sends
  # email and SMS inline. Never run it together with beat: both would schedule the jobs.
  # JOB_RUNNER=daemon must hold for the whole stack, so that the API sends account emails
  # inline and hands "match my search" to the daemon instead of to Celery:
  #   echo JOB_RUNNER=daemon >> .env
  #   docker compose --profile sync up -d --scale worker=0 --scale beat=0
  # Back to Celery: remove the line from .env, `docker compose stop sync`, `docker compose up -d`.
  sync:
    <<: *backend
    profiles: ["sync"]
    command: ["sync"]
    environment:
      <<: *backend-env
      JOB_RUNNER: daemon
    depends_on:
      backend:
        condition: service_healthy
    # SIGTERM stops the daemon after the current sync stage (vercel.json gives it the same
    # grace period).
    stop_grace_period: 600s

  frontend:
    build:
      context: ./frontend
      args:
        # The Next.js server proxies /api/* to this URL (resolved inside the compose network).
        BACKEND_URL: http://backend:8000
        # Map tiles; empty = OpenStreetMap. Changing them needs `docker compose build frontend`.
        NEXT_PUBLIC_CARTO_API_KEY: ${NEXT_PUBLIC_CARTO_API_KEY:-}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-}
        MAP_TILE_HOSTS: ${MAP_TILE_HOSTS:-}
    image: ${FRONTEND_IMAGE:-swell-travel-agent/frontend:local}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # Development inbox: captures all mail sent with EMAIL_PROVIDER=mailpit (the compose
  # default). Web UI http://localhost:8025, SMTP on 1025. Harmless when using real delivery.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped  # the image ships its own health check

  # Scheduled database backups (opt-in profile):
  #   docker compose --profile backup up -d backup
  # pg_dump (custom format) on start and then every BACKUP_INTERVAL_HOURS, keeping the
  # BACKUP_KEEP newest and at most BACKUP_MAX_AGE_DAYS days (scripts/backup-db.sh). Files go
  # to the "db-backups" volume, or to a host directory with BACKUP_HOST_DIR=/srv/swell-backups.
  # Copy them off the server too. Restore: scripts/restore-db.sh --compose FILE.dump.
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-swell}
      PGPASSWORD: ${POSTGRES_PASSWORD:-swell}
      PGDATABASE: ${POSTGRES_DB:-swell}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_MAX_AGE_DAYS: ${BACKUP_MAX_AGE_DAYS:-30}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETRY_MINUTES: ${BACKUP_RETRY_MINUTES:-30}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_HOST_DIR:-db-backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    # After a reboot or a Docker restart, restart policies start every container at once,
    # ignoring depends_on: wait for PostgreSQL (up to 10 min) before each backup, and retry
    # a failed backup after BACKUP_RETRY_MINUTES instead of skipping a whole interval.
    command:
      - |
        echo "database backups every $${BACKUP_INTERVAL_HOURS} h into /backups"
        while true; do
          tries=0
          until pg_isready -q || [ $$tries -ge 60 ]; do tries=$$((tries + 1)); sleep 10; done
          if /scripts/backup-db.sh; then
            sleep $$((BACKUP_INTERVAL_HOURS * 3600))
          else
            echo "backup FAILED; next attempt in $${BACKUP_RETRY_MINUTES} min" >&2
            sleep $$((BACKUP_RETRY_MINUTES * 60))
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy
    # Unhealthy when the newest backup is older than the interval plus an hour.
    healthcheck:
      test:
        - CMD-SHELL
        - find /backups -maxdepth 1 -name 'swell-*.dump' -mmin -$$((BACKUP_INTERVAL_HOURS * 60 + 60)) | grep -q .
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 10m
    restart: unless-stopped

volumes:
  pgdata:
  outbox:
  ml-artifacts:
  db-backups:
