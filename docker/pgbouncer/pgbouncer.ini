;; PgBouncer for the local Vercel-style stack: the pooler in front of Postgres that Neon's
;; pooled connection string (DATABASE_URL, host "...-pooler...") goes through. The values
;; that shape behaviour follow Neon's published configuration (neon.com/docs/connect/
;; connection-pooling): pool_mode transaction, max_prepared_statements 1000 and
;; query_wait_timeout 120. The pool sizes are smaller, for one developer machine.
;;
;; In transaction mode a server connection serves one transaction at a time, so session
;; state (SET, LISTEN/NOTIFY, session advisory locks, SQL-level PREPARE) does not carry over
;; from one transaction to the next. The API connects here with DB_PREPARED_STATEMENTS=false;
;; the sync daemon and the migrations use the direct URL (DATABASE_URL_UNPOOLED).
;;
;; The entrypoint copies this file to /tmp/pgbouncer/, puts PGBOUNCER_USER in place of
;; @ADMIN_USER@ and writes the [databases] section (every database name goes to
;; PGBOUNCER_UPSTREAM_HOST:PGBOUNCER_UPSTREAM_PORT) and the user list.

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

pool_mode = transaction
max_prepared_statements = 1000
query_wait_timeout = 120
max_client_conn = 500
default_pool_size = 20

auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
;; The connecting user may read SHOW CONFIG / SHOW POOLS / SHOW STATS on the "pgbouncer"
;; admin database (scripts/vercel-local.sh smoke reads pool_mode and the query counters).
admin_users = @ADMIN_USER@
stats_users = @ADMIN_USER@

ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0

%include /tmp/pgbouncer/databases.ini
