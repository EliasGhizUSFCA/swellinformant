# Alembic configuration (backend/alembic). The database URL comes from the app's settings
# (alembic/env.py sets sqlalchemy.url), never from this file.

[alembic]
script_location = %(here)s/alembic
# New revisions: `alembic revision --rev-id 0009 -m "what changes"` -> 0009_what_changes.py
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# Logging (alembic/env.py calls fileConfig).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
