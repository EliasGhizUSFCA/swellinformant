[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swell-travel-agent"
version = "1.0.0"
description = "Swell Travel Agent — surf forecast driven travel discovery and alerts"
requires-python = ">=3.12"
# The lean API set: what the hosted API (a Vercel Python function) installs, and all it
# imports. Celery, the uvicorn[standard] speed-ups and the data libraries are extras below;
# tests/unit/test_lean_imports.py keeps the API importable without them, and
# scripts/check_api_bundle.py keeps this set under the function size budget.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.30,<2.2",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "cryptography>=43",
]

[project.optional-dependencies]
# Celery worker and beat (the classic docker compose stack, JOB_RUNNER=celery).
worker = [
    "celery>=5.4,<6",
]
# uvloop, httptools, websockets and watchfiles for a long-running uvicorn server.
server = [
    "uvicorn[standard]>=0.30",
]
# The data pipeline: the sync daemon (repo-root Containerfile), the Celery worker and the
# CLI's obs / verify / ml / engine groups.
sync = [
    "pandas>=2.2",
    # GRIB2 decoding for the map layers and direct NOAA / ECMWF ingestion.
    "eccodes>=2.41",
    # The ecCodes C library. eccodes' py3-none-any wheel requires it outside Windows, but its
    # Windows wheels (which bundle the library) do not, and uv locks one set of metadata per
    # version: without this line uv.lock leaves eccodeslib out, and an install from the lock
    # fails at the first GRIB decode with "Cannot find the ecCodes library".
    "eccodeslib>=2.41; platform_system != 'Windows'",
    # Parquet reader for AODN cloud-optimised buoy data.
    "pyarrow>=17",
    # Baselines and gradient boosting for forecast post-processing.
    "scikit-learn>=1.5",
    "joblib>=1.4",
]
# Everything the app can run: the classic image (backend/Dockerfile) installs this.
all = [
    "swell-travel-agent[worker,server,sync]",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "swell-travel-agent[all]",
]
# One-off extraction of harmonic tide constants for the committed constants file
# (scripts/extract_tide_constants.py); never imported by the app at runtime.
# pyTMD 3.0.9 (MIT) was released on PyPI on 2026-07-02.
tides-extract = [
    "pyTMD==3.0.9",
]

[tool.uv]
# uv.lock (installed by the Vercel builder, backend/Dockerfile, the repo-root Containerfile
# and docker/api-lean; CI installs with it as pip constraints) resolves only releases uploaded
# before this date, so a package published days ago never reaches a deployment. When updating
# the lock, move it to a date at least two weeks back and run `uv lock --upgrade`.
exclude-newer = "2026-10-08T00:00:00Z"
# Security exceptions to that date, one per package, each naming the advisory it fixes; drop an
# entry once exclude-newer has moved past it. certifi 2026.10.19 (uploaded 2026-10-20) removes
# the emSign intermediates with compromised keys (GHSA-6q48-6c7w-9gw2, critical).
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need PostgreSQL (and sometimes Redis)",
]
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "S311",  # random is used for the demo providers only, never for security
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "E501"]
"alembic/**" = ["E501"]
"app/services/notifications/templates.py" = ["E501"]  # inline-styled email HTML

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
